<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservaciones | Taquería El Salvaje</title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="styles.css">

</head>


<body>

    <div class="container">


        <!-- ENCABEZADO -->

        <header class="text-center py-4">

            <h1>RESERVACIONES</h1>

        </header>


        <!-- NAVEGACIÓN -->

        <nav class="navbar navbar-expand-md navbar-dark bg-danger rounded mb-4">

            <div class="container-fluid justify-content-center">

                <div class="navbar-nav">

                    <a
                        class="nav-link"
                        href="INDEX.html">

                        INICIO

                    </a>

                    <a
                        class="nav-link"
                        href="menu.html">

                        MENÚ

                    </a>

                    <a
                        class="nav-link"
                        href="nosotros.html">

                        SOBRE NOSOTROS

                    </a>

                    <a
                        class="nav-link active"
                        href="reservaciones.html">

                        RESERVACIONES

                    </a>

                    <a
                        class="nav-link"
                        href="contacto.html">

                        CONTACTO

                    </a>

                </div>

            </div>

        </nav>


        <!-- ALERT -->

        <div
            class="alert alert-info text-center"
            role="alert">

            📅 Reserva tu mesa y disfruta de nuestros tacos.

        </div>


        <!-- FORMULARIO -->

        <section class="py-5">

            <div class="row justify-content-center">

                <div class="col-md-8">

                    <div class="card shadow-sm">

                        <div class="card-body p-4">

                            <h2 class="mb-4">
                                Reserva tu mesa
                            </h2>


                            <form>


                                <!-- NOMBRE -->

                                <div class="mb-3">

                                    <label
                                        for="nombre"
                                        class="form-label">

                                        Nombre:

                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="nombre"
                                        name="nombre"
                                        placeholder="Escribe tu nombre"
                                        required>

                                </div>


                                <!-- PERSONAS -->

                                <div class="mb-3">

                                    <label
                                        for="personas"
                                        class="form-label">

                                        Número de personas:

                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="personas"
                                        name="personas"
                                        min="1"
                                        placeholder="Número de personas"
                                        required>

                                </div>


                                <!-- FECHA Y HORA -->

                                <div class="row">

                                    <div class="col-md-6 mb-3">

                                        <label
                                            for="fecha"
                                            class="form-label">

                                            Fecha:

                                        </label>

                                        <input
                                            type="date"
                                            class="form-control"
                                            id="fecha"
                                            name="fecha"
                                            required>

                                    </div>


                                    <div class="col-md-6 mb-3">

                                        <label
                                            for="hora"
                                            class="form-label">

                                            Hora:

                                        </label>

                                        <input
                                            type="time"
                                            class="form-control"
                                            id="hora"
                                            name="hora"
                                            required>

                                    </div>

                                </div>


                                <!-- BOTÓN -->

                                <button
                                    type="submit"
                                    class="btn btn-danger w-100">

                                    RESERVAR

                                </button>


                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- FOOTER -->

        <footer class="text-center py-4 border-top">

            <p>

                ©️ 2026 Taquería El Salvaje.
                Todos los derechos reservados.

            </p>

        </footer>

    </div>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
